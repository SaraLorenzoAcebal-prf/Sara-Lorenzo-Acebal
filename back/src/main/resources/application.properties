spring.application.name=porfolio-blog

# Configuracion externa: usa variables de entorno en cualquier despliegue publico.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/porfolio_blog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Servidor
server.port=${SERVER_PORT:8080}

# Usuario admin (obligatorio para habilitar el panel)
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

# CORS: solo los frontends indicados
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}

# Subida de archivos
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Formulario de contacto
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:saralorenzoacebal05@gmail.com}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.contact.recipient=${CONTACT_RECIPIENT:saralorenzoacebal05@gmail.com}

# Clave aleatoria de al menos 32 caracteres en produccion
app.security.jwt-secret=${JWT_SECRET:}
